name: Strona WWW

# Strona na GitHub Pages: statyczne pliki z site/ + dane z gałęzi "dane".
# - codziennie w nocy: pobranie świeżych danych z API NFZ (ok. 1-1,5 h) i publikacja,
# - zmiana w site/ na main: publikacja z ostatnimi pobranymi danymi,
# - ręcznie (Actions -> Strona WWW -> Run workflow): z opcją pobrania danych.

on:
  schedule:
    - cron: "15 1 * * *" # codziennie ok. 2:15-3:15 czasu polskiego
  workflow_dispatch:
    inputs:
      pobierz_dane:
        description: "Pobierz świeże dane z API NFZ (ok. 1-1,5 h)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/strona.yml"

permissions:
  contents: read

concurrency:
  group: strona
  cancel-in-progress: false

jobs:
  dane:
    name: Pobranie danych z API NFZ
    if: github.event_name == 'schedule' || inputs.pobierz_dane
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Cache geokodowania z poprzedniego pobrania
        run: |
          mkdir -p dane/cache
          if git ls-remote --exit-code --heads origin dane > /dev/null \
             && git fetch -q --depth 1 origin dane \
             && git show FETCH_HEAD:cache/geokodowanie.json > dane/cache/geokodowanie.json; then
            echo "Wczytano cache: $(wc -c < dane/cache/geokodowanie.json) bajtów"
          else
            rm -f dane/cache/geokodowanie.json
            echo "Brak cache - geokodowanie od zera (pierwsze uruchomienie potrwa dłużej)"
          fi
      - name: Eksport wszystkich województw z geokodowaniem
        # po 240 min nie geokodujemy nowych adresów - resztę dokończy kolejna noc
        run: >
          python -m nfz_terminy.export --out dane
          --geokoduj --geokod-cache dane/cache/geokodowanie.json --geokod-minut 240
      - name: Zapis w gałęzi "dane" (jeden commit, nadpisywany)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dane
          git init -q -b dane
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Dane z API NFZ, $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dane

  wdrozenie:
    name: Publikacja na GitHub Pages
    needs: dane
    if: ${{ !cancelled() && (needs.dane.result == 'success' || needs.dane.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sprawdzenie, czy dane już istnieją
        id: dane
        run: |
          if git ls-remote --exit-code --heads origin dane > /dev/null; then
            echo "istnieja=true" >> "$GITHUB_OUTPUT"
          else
            echo "istnieja=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nie ma jeszcze danych (gałęzi 'dane'), więc strona nie zostanie opublikowana. Uruchom ręcznie: Actions -> Strona WWW -> Run workflow, z zaznaczonym 'Pobierz świeże dane'."
          fi
      - uses: actions/checkout@v4
        if: steps.dane.outputs.istnieja == 'true'
        with:
          ref: dane
          path: _dane
      - name: Złożenie strony
        if: steps.dane.outputs.istnieja == 'true'
        run: |
          mkdir -p _site/data
          cp -r site/. _site/
          rm -rf _site/tests
          cp _dane/*.json _site/data/
          ls -la _site _site/data | head -50
      - uses: actions/configure-pages@v5
        if: steps.dane.outputs.istnieja == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.dane.outputs.istnieja == 'true'
        with:
          path: _site
      - id: deploy
        if: steps.dane.outputs.istnieja == 'true'
        uses: actions/deploy-pages@v4
